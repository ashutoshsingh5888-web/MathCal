<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive: Squaring Numbers Ending in 5 | Mental Math Daily</title>
<meta name="description" content="An interactive walkthrough and quiz for the mental math shortcut to square any number ending in 5." />
<link rel="canonical" href="https://math-daily.pages.dev/interactive/squares-ending-in-5.html" />
<script async src="https://www.googletagmanager.com/gtag/js?id=G-EQ795YQS1V"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-EQ795YQS1V');
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root {
    --bg: #12201b;
    --bg-raised: #1b2e27;
    --bg-raised-2: #23392f;
    --ink: #f3efe1;
    --ink-dim: #a7b8ae;
    --rule: rgba(243, 239, 225, 0.16);
    --rule-strong: rgba(243, 239, 225, 0.3);
    --yellow: #e4be5c;
    --teal: #6fa8a0;
    --coral: #cc6b49;
    --green: #86b37b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 32px 32px;
    padding: 28px 18px 48px;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 6px;
  }

  h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--ink-dim);
    font-size: 0.92rem;
    line-height: 1.5;
    margin: 0 0 22px;
  }

  .card {
    background: var(--bg-raised);
    border: 1.5px dashed var(--rule-strong);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 16px;
  }

  .rule-box {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    color: var(--yellow);
    background: var(--bg-raised-2);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 4px;
  }

  /* ---- Picker ---- */
  .picker-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    margin-bottom: 10px;
  }

  .picker-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .picker-btn {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 0.95rem;
    background: var(--bg-raised-2);
    color: var(--ink);
    border: 1.5px solid var(--rule-strong);
    border-radius: 8px;
    padding: 10px 0;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }

  .picker-btn:hover { border-color: var(--yellow); }
  .picker-btn.active {
    background: var(--yellow);
    border-color: var(--yellow);
    color: #2a2210;
  }

  /* ---- Flow ---- */
  .flow {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    gap: 8px;
    margin-top: 20px;
  }

  .node {
    flex: 1 1 100px;
    min-width: 92px;
    background: var(--bg-raised-2);
    border: 1px solid var(--rule-strong);
    border-radius: 10px;
    padding: 12px 10px;
    text-align: center;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .node.show { opacity: 1; transform: translateY(0); }

  .node .lab {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }

  .node .val {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--ink);
  }

  .node.answer .val { color: var(--green); font-size: 1.35rem; }

  .arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--teal);
    font-size: 18px;
    padding: 0 2px;
  }

  /* ---- Quiz ---- */
  .quiz-question {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.2rem;
    font-weight: 700;
    text-align: center;
    margin: 6px 0 18px;
  }

  .quiz-row {
    display: flex;
    gap: 8px;
  }

  input[type="number"] {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    border: 1.5px solid var(--rule-strong);
    background: var(--bg);
    color: var(--ink);
  }
  input[type="number"]:focus { outline: none; border-color: var(--yellow); }

  button.check {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    background: var(--yellow);
    color: #2a2210;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    cursor: pointer;
  }

  .quiz-feedback {
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    text-align: center;
    min-height: 1.4em;
  }
  .quiz-feedback.ok { color: var(--green); }
  .quiz-feedback.bad { color: var(--coral); }

  button.next {
    display: block;
    margin: 12px auto 0;
    background: transparent;
    border: 1.5px dashed var(--rule-strong);
    color: var(--ink-dim);
    font-family: 'Space Grotesk', sans-serif;
    border-radius: 10px;
    padding: 8px 16px;
    cursor: pointer;
  }
  button.next:hover { border-color: var(--teal); color: var(--teal); }

  @media (max-width: 420px) {
    .quiz-question { font-size: 1.7rem; }
    .flow { flex-direction: column; }
    .arrow { transform: rotate(90deg); padding: 4px 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Mental Math Shortcut</div>
  <h1>Squaring numbers ending in 5</h1>
  <p class="sub">
    Take the digit(s) before the 5, multiply by one more than itself,
    then append 25. Works every time — no exceptions.
  </p>

  <div class="card">
    <div class="rule-box">(k5)² = k × (k+1), then append 25</div>
  </div>

  <div class="card">
    <div class="picker-label">Pick a number ending in 5</div>
    <div class="picker-grid" id="picker"></div>

    <div class="flow" id="flow"></div>
  </div>

  <div class="card">
    <div class="picker-label" style="margin-bottom:14px;">Now try one yourself</div>
    <div class="quiz-question" id="quizQuestion">45²</div>
    <div class="quiz-row">
      <input type="number" id="quizInput" placeholder="Your answer" />
      <button class="check" id="quizCheck">Check</button>
    </div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <button class="next" id="quizNext" style="display:none;">Next number →</button>
  </div>
</div>

<script>
  const picker = document.getElementById('picker');
  const flow = document.getElementById('flow');

  const options = Array.from({length: 12}, (_, i) => (i + 1) * 10 + 5); // 15..125

  function renderFlow(n) {
    const k = Math.floor(n / 10);
    const core = k * (k + 1);
    const answer = core * 100 + 25;

    flow.innerHTML = '';
    const nodes = [
      ['Input', n + '²'],
      ['Take k', k],
      ['k × (k+1)', `${k} × ${k+1} = ${core}`],
      ['Append 25', `${core}25`],
    ];

    nodes.forEach((node, i) => {
      const box = document.createElement('div');
      box.className = 'node' + (i === nodes.length - 1 ? ' answer' : '');
      box.innerHTML = `<div class="lab">${node[0]}</div><div class="val">${node[1]}</div>`;
      flow.appendChild(box);

      if (i < nodes.length - 1) {
        const arrow = document.createElement('div');
        arrow.className = 'arrow';
        arrow.textContent = '→';
        flow.appendChild(arrow);
      }
    });

    requestAnimationFrame(() => {
      [...flow.querySelectorAll('.node')].forEach((el, i) => {
        setTimeout(() => el.classList.add('show'), i * 120);
      });
    });
  }

  options.forEach((n, i) => {
    const btn = document.createElement('button');
    btn.className = 'picker-btn' + (i === 3 ? ' active' : '');
    btn.textContent = n;
    btn.addEventListener('click', () => {
      picker.querySelectorAll('.picker-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderFlow(n);
    });
    picker.appendChild(btn);
  });

  renderFlow(options[3]);

  // ---- Quiz ----
  const quizQuestion = document.getElementById('quizQuestion');
  const quizInput = document.getElementById('quizInput');
  const quizCheck = document.getElementById('quizCheck');
  const quizFeedback = document.getElementById('quizFeedback');
  const quizNext = document.getElementById('quizNext');

  let currentQuizNum = null;

  function newQuizQuestion() {
    const pool = options.filter(n => n !== currentQuizNum);
    currentQuizNum = pool[Math.floor(Math.random() * pool.length)];
    quizQuestion.textContent = currentQuizNum + '²';
    quizInput.value = '';
    quizInput.disabled = false;
    quizFeedback.textContent = '';
    quizFeedback.className = 'quiz-feedback';
    quizCheck.style.display = 'inline-block';
    quizNext.style.display = 'none';
    quizInput.focus();
  }

  function checkQuiz() {
    const answer = currentQuizNum * currentQuizNum;
    const given = Number(quizInput.value);
    const ok = given === answer;
    quizFeedback.textContent = ok ? `Correct — ${answer}` : `Not quite — answer is ${answer}`;
    quizFeedback.className = 'quiz-feedback ' + (ok ? 'ok' : 'bad');
    quizInput.disabled = true;
    quizCheck.style.display = 'none';
    quizNext.style.display = 'block';
  }

  quizCheck.addEventListener('click', checkQuiz);
  quizNext.addEventListener('click', newQuizQuestion);
  quizInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && quizCheck.style.display !== 'none') checkQuiz();
  });

  newQuizQuestion();
</script>
</body>
</html>
